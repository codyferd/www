<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avero Soundboard</title>
  <script libs="core" src="../share/cdn.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <div id="app" v-cloak class="container mx-auto px-4 py-8 max-w-4xl">
    <!-- Header -->
    <header class="flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-slate-800 pb-6 mb-8">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-3 rounded-xl shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-wave-square text-2xl animate-pulse"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Avero Soundboard</h1>
          <p class="text-xs text-slate-400">Click a pad to play instant audio responses</p>
        </div>
      </div>
      
      <!-- Utility Actions -->
      <div v-if="playingSoundsCount > 0" class="flex items-center gap-2">
        <button @click="stopAll" class="bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white border border-rose-500/20 px-4 py-2 rounded-lg text-sm font-medium transition duration-200 flex items-center gap-2">
          <i class="fa-solid fa-stop text-xs"></i> Stop All
        </button>
      </div>
    </header>

    <!-- Global Controls & Search -->
    <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-4 mb-8 backdrop-blur-sm shadow-xl">
      <div class="flex flex-col md:flex-row gap-4 items-center">
        <!-- Search Input -->
        <div class="relative w-full md:flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400 text-sm"></i>
          <input 
            v-model="searchQuery" 
            type="text" 
            placeholder="Search sounds by name or category..." 
            class="w-full bg-slate-900/80 text-white pl-11 pr-4 py-3 rounded-xl border border-slate-700 focus:outline-none focus:border-indigo-500 transition duration-200 placeholder-slate-500 text-sm"
          />
          <button v-if="searchQuery" @click="searchQuery = ''" class="absolute right-4 top-3.5 text-slate-500 hover:text-slate-300">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        
        <!-- Category Filter Pills -->
        <div class="flex flex-wrap gap-2 w-full md:w-auto">
          <button 
            @click="selectedCategory = ''"
            :class="!selectedCategory ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700/70'"
            class="px-3.5 py-2 rounded-xl text-xs font-semibold tracking-wide transition duration-150 uppercase"
          >
            All
          </button>
          <button 
            v-for="cat in categories" 
            :key="cat"
            @click="selectedCategory = cat"
            :class="selectedCategory === cat ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700/70'"
            class="px-3.5 py-2 rounded-xl text-xs font-semibold tracking-wide transition duration-150 uppercase"
          >
            {{ cat }}
          </button>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div v-if="filteredSounds.length === 0" class="text-center py-16 bg-slate-800/20 border border-dashed border-slate-800 rounded-2xl">
      <i class="fa-solid fa-volume-xmark text-4xl text-slate-600 mb-3"></i>
      <p class="text-slate-400 font-medium">No audio found matching your filters</p>
      <button @click="resetFilters" class="mt-2 text-xs text-indigo-400 hover:underline">Reset search criteria</button>
    </div>

    <!-- Sound Board Grid -->
    <div v-else class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
      <button 
        v-for="sound in filteredSounds" 
        :key="sound.id"
        @click="playSound(sound)"
        :class="activeSounds[sound.id] ? 'border-indigo-500 bg-indigo-600/20 text-white ring-2 ring-indigo-500/30' : 'border-slate-800 bg-slate-800/40 text-slate-300 hover:bg-slate-800 hover:border-slate-700'"
        class="group relative flex flex-col items-center justify-center p-6 rounded-2xl border text-center transition-all duration-200 shadow-sm active:scale-95 overflow-hidden"
      >
        <!-- Overlay Pulse Indicator when active -->
        <div v-if="activeSounds[sound.id]" class="absolute inset-0 bg-indigo-500/10 animate-pulse pointer-events-none"></div>

        <!-- Category Tag -->
        <span class="absolute top-2 right-2 text-[9px] uppercase tracking-wider font-semibold opacity-40 px-1.5 py-0.5 rounded bg-slate-900/50">
          {{ sound.category }}
        </span>

        <!-- Audio Waves Icon -->
        <div :class="activeSounds[sound.id] ? 'text-indigo-400 scale-110' : 'text-slate-500 group-hover:text-slate-400'" class="mb-3 transition-transform duration-200">
          <i :class="activeSounds[sound.id] ? 'fa-solid fa-volume-high' : 'fa-solid fa-play'"></i>
        </div>

        <!-- Sound Label -->
        <div class="font-medium text-sm truncate w-full px-1">{{ sound.name }}</div>
      </button>
    </div>
  </div>
  <script src="list.js"></script>
  <script src="index.js"></script>
</body>
</html>
